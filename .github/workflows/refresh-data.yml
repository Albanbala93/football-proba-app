name: Refresh current season data

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas requests python-dotenv

      - name: Download current season data
        id: download
        continue-on-error: true
        run: python scripts/download_big5_data.py --current-season-only

      # football-data.co.uk has occasionally rejected requests from GitHub
      # Actions (persistent 503s) while remaining reachable from a normal
      # browser -- this fills in whatever results it's missing from
      # API-Football instead of leaving the app on stale data. Keep the
      # --season value in sync with SEASONS[-1] in download_big5_data.py.
      - name: Fallback - fetch missing results from API-Football
        if: steps.download.outcome == 'failure'
        continue-on-error: true
        run: python scripts/fetch_api_football_results_fallback.py --season 2026

      - name: Regenerate upcoming fixtures and current teams reference
        run: |
          python scripts/generate_upcoming_fixtures.py
          python scripts/generate_current_teams.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw data/reference/upcoming_fixtures.csv data/reference/current_teams.csv
          if git diff --cached --quiet; then
            echo "No changes to current season data."
            exit 0
          fi
          git commit -m "Refresh current season data (automated)"
          git push
