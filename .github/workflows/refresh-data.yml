name: Refresh current season data

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download current season data
        run: python scripts/download_big5_data.py --current-season-only

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/raw; then
            echo "No changes to current season data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw
          git commit -m "Refresh current season data (automated)"
          git push
